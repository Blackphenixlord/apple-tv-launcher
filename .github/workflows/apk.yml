name: APK

# Builds the release APK on every push and keeps it as a downloadable artifact (Actions > this run >
# Artifacts), so the TV can be updated without an Android SDK. A tag like v1.3-family also attaches the APK
# to a GitHub Release.
#
# Signing: with the repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS
# and RELEASE_KEY_PASSWORD set, every build is signed with the same key, so each new APK installs over the last
# one and the launcher keeps its settings. Without them the build is signed with a throwaway debug key, which
# works for a first install, but the next build will not install over it until the old one is uninstalled
# (INSTALL-FAMILY.md, "Signing").

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret: signing with a throwaway debug key (see INSTALL-FAMILY.md, Signing)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"
          echo "SIGNING_ARGS=-PreleaseKeystore=$RUNNER_TEMP/signing/keystore.properties" >> "$GITHUB_ENV"

      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease $SIGNING_ARGS

      - name: Name the APK
        id: name
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" launcher/app/build.gradle)
          name="apple-tv-launcher-family-${version}-${GITHUB_SHA::7}.apk"
          cp launcher/app/build/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "APK: $name ($(( $(stat -c %s "$name") / 1024 )) KB)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apple-tv-launcher-family-apk
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
          generate_release_notes: true

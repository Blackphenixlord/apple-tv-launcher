plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        // Apple TV Launcher's own numbering, from its 1.0 release (the original CleanYourTV was at 5 / 2.4).
        versionCode 13
        versionName '1.2-family'
    }

    // Release signing for the published APK: keystore.properties (storeFile, storePassword, keyAlias, keyPassword)
    // kept outside the repo, found through -PreleaseKeystore=<path> or ~/apple-tv-launcher-signing/. Without it
    // (anyone building their own copy) the release build falls back to the debug key, as before.
    def ksFile = file(providers.gradleProperty('releaseKeystore').getOrElse(
            System.getProperty('user.home') + '/apple-tv-launcher-signing/keystore.properties'))
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
        if (ks.storeFile) {
            release {
                storeFile file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key when keystore.properties is there (the published APK), else the debug key.
            signingConfig ks.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
